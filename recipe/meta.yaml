{% set version = "0.4.2" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-ratelimitr
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/ratelimitr_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/ratelimitr/ratelimitr_{{ version }}.tar.gz
  sha256: 924e71b950828229498e64a93614c71e5a1c16f83cddfa5c084f3f1990aa5f53

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-assertthat
  run:
    - r-base
    - r-assertthat

test:
  commands:
    - $R -e "library('ratelimitr')"           # [not win]
    - "\"%R%\" -e \"library('ratelimitr')\""  # [win]

about:
  home: https://github.com/tarakc02/ratelimitr
  license: MIT
  summary: Allows to limit the rate at which one or more functions can be called.
  license_family: MIT
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/MIT
    - LICENSE

extra:
  recipe-maintainers:
    - conda-forge/r
